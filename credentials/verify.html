<html>
<head>
    <title>initCradle Login</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #cce6ff; /* exact color */
            font-family: Arial, Helvetica, sans-serif;
            color: #1E2B3C;

            background-image: url("images/inticradle2-removebg-preview.png");
            background-size: 40px 40px;
            background-repeat: repeat;
            
        }

        /* Make background image VERY faint */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9); /* higher = less visible image */
            z-index: -1;
        }

        .login-box {
            background: white;
            padding: 30px 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .login-box img {
            display: block;
            margin: 0 auto 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #1E2B3C;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #1E2B3C;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2f3f55;
        }

        .bottom-links {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
        }

        a {
            text-decoration: none;
            color: #1E2B3C;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <img src="images/inticradle1-removebg-preview.png" width="180" alt="initCradle">

        <form action ="login.html">

            <div class="form-group">
                <label>OTP</label>
                <input type="password" required>
            </div>

            <button type="submit">Verify</button>
        </form>

        <div class="bottom-links">
            <a href="login.html">Already a user? Login</a>
        </div>
    </div>

</body>
</html>
