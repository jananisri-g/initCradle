<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>initCradle — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:         #0F1729;
            --accent:       #3B7FFF;
            --accent-soft:  rgba(59,127,255,0.10);
            --text-primary: #0D1B2E;
            --text-body:    #2C3E52;
            --text-muted:   #6B7F96;
            --border:       rgba(15,23,41,0.10);
            --radius:       10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            line-height: 1.85;
            color: var(--text-body);
            background-color: #cce6ff;
            background-image: url("images/inticradle2-removebg-preview.png");
            background-size: 40px 40px;
            background-repeat: repeat;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.90);
            z-index: -1;
        }

        /* ── Login card ── */
        .login-card {
            width: 400px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow:
                0 4px 6px rgba(15,23,41,0.07),
                0 12px 28px rgba(15,23,41,0.13),
                0 32px 64px rgba(15,23,41,0.10),
                0 2px 0px rgba(255,255,255,0.8) inset;
            padding: 28px 28px 28px;
            animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0;
            line-height: 0;
        }
        .logo-wrap img {
            height: 150px;
            width: 100%;
            object-fit: contain;
            display: block;
            margin-bottom: -10px;
        }

        /* ── Heading ── */
        h2 {
            font-family: 'Lora', serif;
            font-size: 21px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 0;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ── Button ── */
        button {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }
        button:hover {
            background: #1a2e4a;
            box-shadow: 0 4px 18px rgba(15,23,41,0.18);
        }
        button:active {
            transform: scale(0.985);
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 16px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Google button ── */
        .btn-google {
            width: 100%;
            padding: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            margin-bottom: 20px;
        }
        .btn-google:hover {
            background: #f7f9fc;
            box-shadow: 0 4px 14px rgba(15,23,41,0.10);
        }
        .btn-google:active {
            transform: scale(0.985);
        }
        .btn-google svg {
            flex-shrink: 0;
        }

        /* ── Bottom links ── */
        .bottom-links {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            font-weight: 500;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.15s;
        }
        a:hover {
            opacity: 0.75;
            text-decoration: underline;
        }

        /* ── Footer note ── */
        
    </style>
</head>
<body>

    <div class="login-card">

        <div class="logo-wrap">
            <img src="images/inticradle1-removebg-preview.png" alt="initCradle">
        </div>

        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue your learning journey.</p>

        <form action="../java/java1.html">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="divider">or</div>

        <button class="btn-google" type="button">
            <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </button>

        <div class="bottom-links">
            <a href="forgotpassword.html">Forgot password?</a>
            <a href="register.html">New user? Register</a>
        </div>

    </div>


</body>
</html>
